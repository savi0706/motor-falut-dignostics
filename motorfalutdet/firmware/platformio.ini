; ============================================================
; Adaptive Multi-Sensor TinyML Motor Fault Diagnosis System
; Target: ESP32-S3-DevKitC-1
; Framework: Arduino
; ============================================================

[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Board settings
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Build flags
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_TFLITE_ENABLE_DEFAULT_OPS=1
    -Os

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file

; Libraries
lib_deps =
    ; TensorFlow Lite Micro - ESP32-S3 compatible
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0

    ; Sensor libraries
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    wollewald/INA219_WE @ ^1.3.7

    ; Display
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11

    ; WiFi / Web server (built-in ESP32 framework)
    ; WiFi.h, WebServer.h, ArduinoJson are bundled

    ; JSON
    bblanchon/ArduinoJson @ ^7.3.0

; NOTE: Credentials loaded from secrets.h (not committed to git)
